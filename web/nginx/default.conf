# Static site only. Route /api to the API server in front of this container
# (e.g. the Ingress); the console calls it on the same origin.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # API calls that reach the console were misrouted upstream; answer 404
    # instead of falling back to index.html with a 200.
    location /api/ {
        return 404;
    }

    # Vite puts a content hash in every asset name, so these never change.
    location /assets/ {
        include /etc/nginx/console/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell, which must never be cached.
    location / {
        include /etc/nginx/console/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
